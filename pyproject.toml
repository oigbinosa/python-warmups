[project]
name = "python-warmups"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Osagie Igbinosa", email = "oigbinosa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
python-warmups = "python_warmups:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
